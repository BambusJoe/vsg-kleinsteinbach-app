# Holt täglich frische SAMS-Daten, setzt sie in index.html ein und deployt – nur wenn sich etwas geändert hat.
# Voraussetzung: Repo-Secret SAMS_API_KEY (Settings → Secrets and variables → Actions).
name: SAMS-Snapshot aktualisieren

on:
  schedule:
    - cron: '30 4 * * *'        # täglich 06:30 MESZ
    - cron: '*/30 8-21 * * 6,0' # Sa + So 10:00–23:30 MESZ alle 30 min (Fallback, falls der Live-Proxy ausfällt)
  workflow_dispatch:         # manuell: Actions → „SAMS-Snapshot aktualisieren" → Run workflow

permissions:
  contents: write
  pages: write

concurrency:
  group: sams-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test sams/adapter.test.mjs sams/inject.test.mjs

      - name: Snapshot aus SAMS bauen
        env:
          SAMS_API_KEY: ${{ secrets.SAMS_API_KEY }}
        run: node sams/build-snapshot.mjs

      - name: In index.html einsetzen
        run: node sams/inject-snapshot.mjs

      - name: Committen und deployen (nur bei Änderung)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo "Keine neuen Daten – nichts zu tun."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sams/snapshot.json
          git commit -m "SAMS-Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push
          # Pushes mit dem Actions-Token lösen den Pages-Build nicht zuverlässig aus → explizit anstoßen
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
